<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16002b">

  <title>Para Priscila 💜</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div id="intro" class="overlay-screen">
    <div class="intro-card">
      <div class="heart">💜</div>

      <h1>Para Priscila</h1>

      <p>Hay un pequeño universo hecho para ti…</p>

      <button id="enter">
        Abrir mi regalo ✨
      </button>
    </div>
  </div>

  <div id="codeGate" class="overlay-screen hidden">
    <div class="intro-card">
      <div class="heart">🔒</div>

      <p>Ah pero no es tan fácil… para verlo tienes que colocar la fecha en que te escribí la primera vez</p>

      <input
        type="tel"
        id="codeInput"
        inputmode="numeric"
        maxlength="6"
        placeholder="______"
        autocomplete="off"
      >

      <button id="codeSubmit">Entrar 💜</button>

      <p id="codeError" class="code-error hidden">Esa no es la fecha… intenta de nuevo</p>
    </div>
  </div>

  <div id="scene"></div>

  <div id="message">
    <span>💜</span>
    <h2>
      Feliz cumpleaños<br>
      te amo
    </h2>
    <p id="love">Te amo ✨</p>
  </div>

  <div id="hint">
    ☝️ Arrastra para girar · 🤏 Pellizca para acercarte
  </div>

  <audio id="bgMusic" src="song.mp3" preload="auto" loop></audio>

  <script>
  const introEl = document.getElementById('intro');
  const codeGateEl = document.getElementById('codeGate');
  const enterBtn = document.getElementById('enter');
  const codeInput = document.getElementById('codeInput');
  const codeSubmit = document.getElementById('codeSubmit');
  const codeError = document.getElementById('codeError');
  const bgMusic = document.getElementById('bgMusic');

  const CORRECT_CODE = '110925';

  enterBtn.addEventListener('click', function () {
    introEl.classList.add('hidden');
    codeGateEl.classList.remove('hidden');

    bgMusic.volume = 0.5;
    bgMusic.play().catch(function () {});

    setTimeout(function () {
      introEl.style.display = 'none';
      codeInput.focus();
    }, 900);
  });

  function checkCode() {
    if (codeInput.value.trim() === CORRECT_CODE) {
      codeGateEl.classList.add('hidden');

      setTimeout(function () {
        codeGateEl.style.display = 'none';
      }, 900);
    } else {
      codeError.classList.remove('hidden');
      codeInput.value = '';
      codeInput.focus();
    }
  }

  codeSubmit.addEventListener('click', checkCode);

  codeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') checkCode();
  });
</script>

<script type="module" src="app.js"></script>

</body>
</html>

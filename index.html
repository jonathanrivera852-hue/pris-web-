<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16002b">

  <title>Para Priscila 💜</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div id="intro">
    <div class="intro-card">
      <div class="heart">💜</div>

      <h1>Para Priscila</h1>

      <p>Hay un pequeño universo hecho para ti…</p>

      <button id="enter">
        Abrir mi regalo ✨
      </button>
    </div>
  </div>

  <div id="hud">
    <div>💜 PRIS</div>
    <button id="heartBtn">❤️ Ver corazón</button>
  </div>

  <div id="scene"></div>

  <div id="message">
    <span>💜</span>
    <h2>
      Feliz cumpleaños<br>
      cielo bello
    </h2>
    <p id="love">Te amo ✨</p>
  </div>

  <div id="hint">
    ☝️ Arrastra para girar · 🤏 Pellizca para acercarte
  </div>

  <div id="heartHint">
    Aleja la vista para descubrir nuestro corazón 💜
  </div>

  <script>
  document.getElementById('enter').addEventListener('click', function () {
    document.getElementById('intro').classList.add('hidden');

    setTimeout(function () {
      document.getElementById('intro').style.display = 'none';
    }, 900);
  });
</script>

<script type="module" src="app.js"></script>


</body>
</html>
